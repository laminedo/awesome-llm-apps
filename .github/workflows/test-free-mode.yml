name: Test free mode (temporary)
on:
  push:
    branches: [claude/hopeful-bohr-lm8k5a]
    paths: [".github/workflows/test-free-mode.yml"]
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'laminedo/awesome-llm-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: advanced_ai_agents/single_agent_apps/ai_movie_production_agent/short_video_studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt httpx
      - name: Make a free video (Hugging Face pictures + backup voices)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python - <<'PY'
          import time
          from fastapi.testclient import TestClient
          import app
          client = TestClient(app.app)
          scenes = [
              {"narration": "My cat thinks she is the boss of this house.", "on_screen_text": "The real boss",
               "visual_prompt": "an orange cat sitting on a throne, wearing a tiny crown"},
              {"narration": "Every morning at five, she demands breakfast.", "on_screen_text": "5 AM alarm",
               "visual_prompt": "an orange cat staring at a sleeping man in bed at dawn"},
              {"narration": "And honestly? I always obey.", "on_screen_text": "I obey",
               "visual_prompt": "a man serving cat food on a silver plate to an orange cat"},
          ]
          for voice in ("en-US-AndrewNeural", "fr-FR-DeniseNeural"):
              t0 = time.time()
              job = client.post("/api/video", json={"title": "Cat boss", "scenes": scenes, "voice": voice}).json()["job_id"]
              while (status := client.get(f"/api/jobs/{job}").json())["status"] == "running":
                  time.sleep(3)
              print(f"\n===== {voice}: {status['status']} in {time.time() - t0:.0f}s =====")
              print("\n".join(status["log"]))
              print("WARNINGS:", status["warnings"])
              print("RESULT:", {k: v for k, v in status.items() if k not in ("log", "warnings")})
              assert status["status"] == "done", status.get("error")
              assert not any("gradient" in w or "silent" in w for w in status["warnings"]), status["warnings"]
          print("\nALL GOOD")
          PY
