name: Deploy Short Video Studio to Hugging Face

# Manual only (Actions tab -> Run workflow): the Docker Space needs Hugging Face PRO.
# To deploy on every change again, add back:
#   push:
#     branches: [main]
#     paths: ["advanced_ai_agents/single_agent_apps/ai_movie_production_agent/short_video_studio/**"]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-short-video-studio
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'laminedo/awesome-llm-apps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.30"
      - name: Upload to the private Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_GPU_TOKEN: ${{ secrets.HF_GPU_TOKEN }}
        run: python advanced_ai_agents/single_agent_apps/ai_movie_production_agent/short_video_studio/hf_space/deploy.py
