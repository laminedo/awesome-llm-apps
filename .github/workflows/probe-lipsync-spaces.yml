name: Probe lip-sync Spaces (temporary)

on:
  push:
    branches: [claude/hopeful-bohr-lm8k5a]
    paths: [".github/workflows/probe-lipsync-spaces.yml"]

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'laminedo/awesome-llm-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q huggingface_hub gradio_client
      - name: Show how to call the best candidates
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, inspect
          import gradio_client
          from gradio_client import Client
          print("gradio_client", gradio_client.__version__, inspect.signature(Client.__init__))
          for sid in ["meituan-longcat/LongCat-Video-Avatar-1.5-Demo", "victor/LongCat-Video-Avatar-1.5",
                      "multimodalart/MoDA-fast-talking-head", "fffiloni/EchoMimic", "alexnasa/OmniAvatar"]:
              print(f"\n######## {sid}")
              try:
                  c = Client(sid, token=os.environ["HF_TOKEN"], verbose=False)
                  c.view_api(print_info=True)
              except Exception as e:
                  print("view_api failed:", type(e).__name__, str(e)[:300])
          PY
