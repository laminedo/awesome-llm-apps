name: Probe lip-sync Spaces (temporary)

on:
  push:
    branches: [claude/hopeful-bohr-lm8k5a]
    paths: [".github/workflows/probe-lipsync-spaces.yml"]

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'laminedo/awesome-llm-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q huggingface_hub gradio_client
      - name: List running talking-head Spaces and their APIs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          from gradio_client import Client
          api = HfApi(token=os.environ["HF_TOKEN"])
          print("me:", api.whoami()["name"])
          seen = {}
          for term in ["sadtalker", "wav2lip", "lipsync", "lip sync", "talking head", "talking avatar",
                       "liveportrait", "echomimic", "hallo", "longcat avatar", "omniavatar", "sonic talking"]:
              try:
                  for s in api.list_spaces(search=term, sort="likes", limit=12):
                      seen.setdefault(s.id, getattr(s, "likes", 0))
              except Exception as e:
                  print("search failed", term, e)
          ranked = sorted(seen.items(), key=lambda kv: -(kv[1] or 0))[:30]
          running = []
          for sid, likes in ranked:
              try:
                  rt = api.get_space_runtime(sid)
                  stage, hw = str(getattr(rt.stage, "value", rt.stage)), str(rt.hardware)
              except Exception as e:
                  stage, hw = f"ERR {type(e).__name__}", "?"
              print(f"{likes:>6}  {stage:<14} {hw:<14} {sid}")
              if stage == "RUNNING":
                  running.append(sid)
          print("\n==== APIs of running Spaces ====")
          for sid in running[:10]:
              print(f"\n######## {sid}")
              try:
                  c = Client(sid, hf_token=os.environ["HF_TOKEN"], verbose=False)
                  c.view_api(print_info=True)
              except Exception as e:
                  print("view_api failed:", type(e).__name__, str(e)[:300])
          PY
