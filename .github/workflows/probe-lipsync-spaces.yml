name: Probe lip-sync Spaces (temporary)

on:
  push:
    branches: [claude/hopeful-bohr-lm8k5a]
    paths: [".github/workflows/probe-lipsync-spaces.yml"]

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'laminedo/awesome-llm-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the app
        working-directory: advanced_ai_agents/single_agent_apps/ai_movie_production_agent/short_video_studio
        run: pip install -q -r requirements.txt
      - name: End-to-end talking videos with the real app code
        working-directory: advanced_ai_agents/single_agent_apps/ai_movie_production_agent/short_video_studio
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GOOGLE_API_KEY: fake-not-needed
        run: |
          python - <<'PY'
          import base64, os, time
          import app, video_builder as vb
          def run(job_id, character, effect, lines):
              req = app.VideoRequest(title=job_id, engine="talk", character=character, voice="en-US-AnaNeural",
                                     voice_effect=effect, scenes=[app.Scene(narration=l, on_screen_text=l[:20], visual_prompt=character) for l in lines])
              app.JOBS[job_id] = {"id": job_id, "status": "running", "progress": 0, "step": "", "log": [], "warnings": [], "created": time.time()}
              t0 = time.time()
              app.run_job(job_id, req, "fake-not-needed")
              j = app.JOBS[job_id]
              print(f"\n===== {job_id}: {j['status']} in {time.time()-t0:.0f}s, duration={j.get('duration')} error={j.get('error')}")
              print("LOG:", " | ".join(j["log"]))
              print("WARNINGS:", j["warnings"])
              if j["status"] == "done":
                  out = os.path.join(app.OUTPUT_DIR, job_id, j["filename"])
                  for t in ("0.5", "1.6", "2.7"):
                      thumb = f"/tmp/{job_id}_{t}.jpg"
                      vb.run_ffmpeg(["-ss", t, "-i", out, "-frames:v", "1", "-vf", "crop=iw:iw*1.1:0:ih*0.12,scale=96:-2", "-q:v", "12", thumb])
                      print(f"THUMB {job_id} {t} " + base64.b64encode(open(thumb, "rb").read()).decode())
          run("baby", "a cute chubby baby with big eyes", "Baby",
              ["Listen to me. I am the boss of this house now.", "Where is my milk? I asked five minutes ago!"])
          run("cat", "a fluffy orange cat", "Normal",
              ["Human, you are late. My bowl has been empty for ten whole minutes."])
          PY
